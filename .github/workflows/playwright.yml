name: 🎭 Playwright E2E Regression Tests

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser project to run"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to push gh-pages branch
  pages: write
  id-token: write

# ─────────────────────────────────────────────────────────────────────────────
# Global environment
# ─────────────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"       # Required by Allure CLI
  PLAYWRIGHT_BROWSERS_PATH: "~/.cache/ms-playwright"

# =============================================================================
# JOB 1 ─ Run E2E Regression Tests
# =============================================================================
jobs:
  regression-test:
    name: 🧪 E2E Tests [${{ inputs.browser || 'chromium' }}]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: ⬇️  Checkout source code
        uses: actions/checkout@v4

      # ── 2. Node.js + npm cache ─────────────────────────────────────────────
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"               # Caches ~/.npm automatically

      # ── 3. Install npm packages ────────────────────────────────────────────
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 prevents the postinstall script
      # from downloading browsers (we manage browsers via cache below)
      - name: 📦 Install npm dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # ── 4. Playwright browser cache ────────────────────────────────────────
      - name: 🔍 Resolve Playwright version
        id: pw-version
        run: |
          PW_VERSION=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=${PW_VERSION}" >> $GITHUB_OUTPUT
          echo "Playwright version: ${PW_VERSION}"

      - name: 💾 Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ steps.pw-version.outputs.version }}-${{ runner.os }}
          restore-keys: |
            playwright-${{ steps.pw-version.outputs.version }}-
            playwright-

      # ── 5. Install browsers (conditional on cache) ─────────────────────────
      - name: 🌐 Install Playwright browsers + system deps [cache MISS]
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}

      - name: 🔧 Install system deps only [cache HIT]
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ inputs.browser || 'chromium' }}

      # ── 6. Run tests ───────────────────────────────────────────────────────
      - name: 🎭 Run E2E regression tests — ${{ inputs.browser || 'chromium' }}
        id: playwright-run
        run: |
          npx playwright test \
            --project=${{ inputs.browser || 'chromium' }} \
            --workers=1 \
            --retries=1
        env:
          CI: "true"
          BASE_URL:      ${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'Admin' }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'admin123' }}

      # ── 7. Upload artifacts (always — even on failure) ─────────────────────
      - name: 📊 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

      - name: 🧾 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: 📹 Upload Videos & Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: test-results/
          retention-days: 3
          if-no-files-found: warn

      # ── 8. Job summary ─────────────────────────────────────────────────────
      - name: 📋 Write job summary
        if: always()
        run: |
          echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | \`${{ inputs.browser || 'chromium' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.playwright-run.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY

# =============================================================================
# JOB 2 ─ Generate & Deploy Allure Report → GitHub Pages
# =============================================================================
  allure-report:
    name: 📈 Allure Report → GitHub Pages
    runs-on: ubuntu-latest
    needs: regression-test
    if: always()   # Run even when tests fail

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: ⬇️  Checkout source code
        uses: actions/checkout@v4

      # ── 2. Java (required by Allure CLI) ──────────────────────────────────
      - name: ☕ Setup Java ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      # ── 3. Node.js + Allure commandline ───────────────────────────────────
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install npm dependencies (for allure-commandline)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # ── 4. Download allure-results from Job 1 ─────────────────────────────
      - name: 📥 Download Allure Results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      # ── 5. Restore previous history (for trend charts) ────────────────────
      - name: 📜 Checkout gh-pages branch (for history)
        uses: actions/checkout@v4
        continue-on-error: true   # OK if gh-pages doesn't exist yet (first run)
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: 📂 Restore Allure history into results
        run: |
          if [ -d "gh-pages-dir/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-dir/history/. allure-results/history/
            echo "✅ History restored — trend charts will be available"
          else
            echo "ℹ️  No previous history found (first run)"
          fi

      # ── 6. Generate Allure HTML report ────────────────────────────────────
      - name: 📈 Generate Allure HTML Report
        run: |
          npx allure generate allure-results --clean -o allure-report
          echo "✅ Allure report generated successfully"
          echo "📁 Report size: $(du -sh allure-report | cut -f1)"

      # ── 7. Deploy to GitHub Pages ─────────────────────────────────────────
      - name: 🚀 Deploy Allure Report → GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          commit_message: "📊 Allure Report — run #${{ github.run_number }} [${{ github.sha }}]"
          keep_files: false

      # ── 8. Upload report as downloadable artifact ─────────────────────────
      - name: 🗜️  Upload Allure Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: error

      # ── 9. Print report URL ────────────────────────────────────────────────
      - name: 🔗 Print Allure Report URL
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "## 📊 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Open Allure Report](${REPORT_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Report URL: \`${REPORT_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🎉  Allure Report: ${REPORT_URL}"
          echo "╚══════════════════════════════════════════════════╝"
