name: 🎭 Playwright E2E Regression Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Install & Cache Dependencies
  # ─────────────────────────────────────────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout source code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install npm dependencies
        run: npm ci

      # Cache Playwright browsers by browser version hash
      - name: 🔍 Get Playwright browser version
        id: playwright-version
        run: echo "version=$(npx playwright --version)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
          restore-keys: |
            playwright-browsers-${{ steps.playwright-version.outputs.version }}-
            playwright-browsers-

      - name: 🌐 Install Playwright browsers & system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: 📦 Install system deps only (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

  # ─────────────────────────────────────────────
  # JOB 2: Run Regression Tests
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Run E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'workflow_dispatch' && inputs.browser != 'all' && fromJSON(format('["{0}"]', inputs.browser)) || fromJSON('["chromium", "firefox", "webkit"]') }}

    steps:
      - name: ⬇️ Checkout source code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install npm dependencies
        run: npm ci

      - name: 🔍 Get Playwright browser version
        id: playwright-version
        run: echo "version=$(npx playwright --version)" >> $GITHUB_OUTPUT

      - name: 💾 Restore Playwright browsers from cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
          restore-keys: |
            playwright-browsers-${{ steps.playwright-version.outputs.version }}-
            playwright-browsers-

      - name: 🌐 Install Playwright browsers (if cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: 📦 Install system deps only (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: 🎭 Run Playwright regression tests — ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'Admin' }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'admin123' }}

      # ── Artifacts — always upload even on failure ──
      - name: 📊 Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

      - name: 🧾 Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: 📹 Upload Test Videos (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos-${{ matrix.browser }}
          path: test-results/
          retention-days: 3

  # ─────────────────────────────────────────────
  # JOB 3: Generate & Deploy Allure Report
  # ─────────────────────────────────────────────
  allure-report:
    name: 📈 Generate & Deploy Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: ⬇️ Checkout source code
        uses: actions/checkout@v4

      - name: 📥 Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-combined/
          merge-multiple: true

      - name: 📜 Get Allure History from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: 📈 Generate Allure Report with history
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results-combined
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 30

      - name: 🚀 Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: 🧾 Upload consolidated Allure Report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-consolidated
          path: allure-report/
          retention-days: 14
